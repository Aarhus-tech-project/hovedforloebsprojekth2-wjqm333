<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrering & Login</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="utils.js"></script>
</head>
<body>
  <header class="nav"><h1>Turnerings‑App</h1><button id="logoutBtn">Log ud</button></header>
  <div class="container">
    <div class="card">
      <h2>Opret bruger</h2>
      <form id="registerForm">
        <input type="text" id="regUsername" placeholder="Brugernavn" required />
        <input type="email" id="regEmail" placeholder="Email" required />
        <input type="password" id="regPassword" placeholder="Adgangskode" required />
        <button type="submit">Registrer</button>
      </form>
    </div>
    <div class="card">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="text" id="loginUsername" placeholder="Brugernavn" required />
        <input type="password" id="loginPassword" placeholder="Adgangskode" required />
        <button type="submit">Login</button>
      </form>
    </div>
  </div>
  <script type="module">
    import { api, setUserId, showToast, logout } from './utils.js';
    const registerForm = document.getElementById('registerForm');
    const loginForm = document.getElementById('loginForm');

    document.getElementById('logoutBtn').addEventListener('click', logout);
    registerForm.addEventListener('submit', async e => {
      e.preventDefault();
      try {
        const data = {
          Username: document.getElementById('regUsername').value,
          Email: document.getElementById('regEmail').value,
          Password: document.getElementById('regPassword').value
        };
        const res = await api('/api/User/register', 'POST', data);
        setUserId(res.id);
        showToast('Registrering succesfuld!');
        location.href = 'dashboard.html';
      } catch (err) {
        showToast(err.message, true);
      }
    });

    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      try {
        const data = {
          Username: document.getElementById('loginUsername').value,
          Password: document.getElementById('loginPassword').value
        };
        const res = await api('/api/User/login', 'POST', data);
        setUserId(res.id);
        showToast('Login succesfuld!');
        location.href = 'dashboard.html';
      } catch (err) {
        showToast(err.message, true);
      }
    });
  </script>
</body>
</html>
